<header class="site-header">
  <div class="container header-row">
    <a routerLink="/groups" class="logo" aria-label="Tipprunde, zu meinen Tippgruppen">
      <img src="img/logo.svg" alt="Tipprunde" width="150" height="30" />
    </a>
    <nav class="nav" aria-label="Hauptnavigation">
      @if (auth.isLoggedIn()) {
        <a routerLink="/groups" routerLinkActive="active">Tippgruppen</a>
        <span class="nav-user">{{ auth.username() }}</span>
        <button type="button" class="btn btn-secondary btn-small" (click)="logout()">Abmelden</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Anmelden</a>
      }
    </nav>
  </div>
</header>

<main class="container main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <a [href]="mpaUrl + '/public/html/legal/Impressum.html'">Impressum</a>
    <a [href]="mpaUrl + '/public/html/legal/Datenschutz.html'">Datenschutz</a>
    <span class="muted">Spieldaten und Wappen: football-data.org</span>
  </div>
</footer>
